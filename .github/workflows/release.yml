name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - charts/**

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write # for helm/chart-releaser-action to push chart release and create a release
      packages: write # for pushing chart to the GHCR registry
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          # Authenticate as the GitHub Actions bot https://api.github.com/users/github-actions%5Bbot%5D
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Run chart-releaser
        # Fork of helm/chart-releaser-action to avoid unwanted release attempts.
        # Upstream PR: https://github.com/helm/chart-releaser-action/pull/80
        uses: florisvdg/chart-releaser-action@1a23f70cddff05ef50ff92afdb29a51ccf3dec28 # v1.3.0
        with:
          charts_dir: charts
        id: cr
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SKIP_EXISTING: true

      - name: Check for released packages
        id: check_packages
        run: |
          if [ -d ".cr-release-packages" ] && [ -n "$(ls -A .cr-release-packages/ 2>/dev/null)" ]; then
            echo "has_packages=true" >> $GITHUB_OUTPUT
            echo "Found packages:"
            ls -la .cr-release-packages/
          else
            echo "has_packages=false" >> $GITHUB_OUTPUT
            echo "No packages found"
          fi

      - if: ${{ steps.check_packages.outputs.has_packages == 'true' }}
        name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: ${{ steps.check_packages.outputs.has_packages == 'true' }}
        name: Push Charts to GHCR
        run: |
          for pkg in .cr-release-packages/*; do
            helm push "${pkg}" oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,} # convert repository owner to lowercase
          done
