name: Run acceptance tests [Connect chart]
on:
  push:

  # Workflow dispatch listener to enable on-demand acceptance test runs on external PRs.
  # How to use this:
  # * Do a sanity check on the submitted PR
  # * Copy the most recent commit hash of the PR branch
  # * Go to 'Actions' -> 'Run acceptance tests' -> 'Run workflow'
  # * Fill in the following:
  #   * `checkout-repo`: `<PR author>/connect-helm-charts`
  #   * `checkout-ref`: <copied commit hash>
  workflow_dispatch:
    inputs:
      checkout-repo:
        required: false
      checkout-ref:
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          repository: ${{ github.event.inputs.checkout-repo }}
          ref: ${{ github.event.inputs.checkout-ref }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up ct CLI
        uses: step-security/chart-testing-action@e66d34fcc8fcc5da27c3442bd532031edb3ce1aa # v2.8.0

      - name: Check if chart has changed
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install yq
        run: sudo snap install yq
        if: steps.list-changed.outputs.changed == 'true'

      - name: Spin up local Kubernetes cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Run acceptance tests
        working-directory: charts/connect
        env:
          OP_CONNECT_CREDENTIALS: ${{ secrets.OP_CONNECT_CREDENTIALS }}
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_VAULT_ID: ${{ secrets.OP_VAULT_ID }}
          OP_ITEM_ID: ${{ secrets.OP_ITEM_ID }}
          OP_SECRET_VALUE: ${{ secrets.OP_SECRET_VALUE }}
        run: make test-e2e
